<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="nfGrad" x1="15" y1="15" x2="105" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1b3624"/>
      <stop offset="50%" stop-color="#2a5237"/>
      <stop offset="100%" stop-color="#467c57"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="30" y1="30" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2f0e0"/>
      <stop offset="100%" stop-color="#a8d4ad"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="120" height="120" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#14261a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Rounded Hex/Squircle Badge -->
  <rect x="10" y="10" width="100" height="100" rx="30" fill="url(#nfGrad)" filter="url(#shadow)"/>
  <rect x="11" y="11" width="98" height="98" rx="29" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

  <!-- Concentric Field / Radar Waves -->
  <circle cx="60" cy="60" r="38" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="60" cy="60" r="26" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>

  <!-- Organic Sensing Leaf & Locality Vector -->
  <path d="M60 84V56M60 56C44 56 38 46 38 34C50 34 60 40 60 56ZM60 56C76 56 82 46 82 34C70 34 60 40 60 56Z" 
        stroke="url(#leafGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central Pulse Coordinate Beacon -->
  <circle cx="60" cy="56" r="4.5" fill="#f4faf3"/>
</svg>
